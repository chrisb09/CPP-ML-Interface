# Construction-only example, NOT an inference demo: Dummy intentionally fails
# when inference is reached by step(). Supply three contiguous float32 input
# fields and three writable output fields, all shaped [8, 8, 8], from C++.
# The manual --config-file harness supplies empty buffers and cannot use this.
# See documentation/configs/README.md for buffer setup and backend templates.
coupling_type = "STATIC"

[logging]
level = "info"
error_separate = false

[library]
class = "Dummy"

[application]
class = "MLCouplingApplicationFlowExtrapolator"
cube_dimension = 8
cube_overlap = 0
input_sequence_length = 1
forecast_window = 1
n_ghost_layers = 0

# No behavior table: inference is requested on every step.
# No normalization table: values are passed through without scaling.
